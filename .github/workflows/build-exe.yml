name: build-exe

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Rehearsal only: build under another version number"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - clip_search.py
      - .github/workflows/build-exe.yml

permissions:
  contents: write

concurrency:
  group: build-exe
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.ver.outputs.v }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rehearsal version
        if: ${{ inputs.version != '' }}
        env:
          V: ${{ inputs.version }}
        run: |
          if ($env:V -notmatch '^\d+(\.\d+){1,3}$') { throw "bad version" }
          (Get-Content clip_search.py -Raw -Encoding utf8) -replace '(?m)^VERSION = "[^"]*"', "VERSION = `"$env:V`"" | Set-Content clip_search.py -Encoding utf8 -NoNewline

      - name: Install PyInstaller
        run: python -m pip install --quiet pyinstaller

      - name: Check the program starts
        run: python clip_search.py --selftest

      - name: Write the window and installer sources
        id: ver
        run: |
          python clip_search.py --write-host host
          python clip_search.py --write-installer installer
          python clip_search.py --notes notes.md
          $ver = python clip_search.py --version
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "v=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Version: $ver"

      - name: Refuse to rebuild a released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $r = gh release view "v$env:APP_VERSION" --json isPrerelease 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "::error::Version $env:APP_VERSION is already released. Raise VERSION in clip_search.py for a new test build."
            throw "version already released"
          }
          $global:LASTEXITCODE = 0

      - name: Build the engine (clip_backend.exe)
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --icon host/clip_search.ico --name clip_backend clip_search.py
          New-Item -ItemType Directory -Force app/resources | Out-Null
          Copy-Item dist/clip_backend.exe app/resources/clip_backend.exe

      - name: Get ffmpeg (for trimming clips)
        run: |
          $gz = Join-Path $env:RUNNER_TEMP "ffmpeg.gz"
          Invoke-WebRequest -Uri "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz" -OutFile $gz
          $in = [System.IO.File]::OpenRead($gz)
          $out = [System.IO.File]::Create((Join-Path $PWD "app/resources/ffmpeg.exe"))
          $z = New-Object System.IO.Compression.GZipStream($in, [System.IO.Compression.CompressionMode]::Decompress)
          $z.CopyTo($out); $z.Close(); $out.Close(); $in.Close()
          $ver = & app/resources/ffmpeg.exe -hide_banner -version
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg does not start" }
          Write-Output $ver[0]
          $global:LASTEXITCODE = 0

      - name: Build the window (ClipSearch.exe, WebView2)
        run: |
          $log = dotnet build host/ClipSearch.csproj -c Release -o host/out --nologo "-p:Version=$env:APP_VERSION" 2>&1
          $code = $LASTEXITCODE
          $log | Select-String -Pattern "error CS|error MSB|error NU|: error " | Select-Object -First 20 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
          $log | Select-Object -Last 12
          if ($code -ne 0) { throw "window build failed" }
          Copy-Item host/out/ClipSearch.exe app/ClipSearch.exe
          if (Test-Path host/out/ClipSearch.exe.config) { Copy-Item host/out/ClipSearch.exe.config app/ }
          Write-Output ("Window exe: {0:N0} KB" -f ((Get-Item app/ClipSearch.exe).Length / 1KB))
          $global:LASTEXITCODE = 0

      - name: Check the window opens
        continue-on-error: true
        run: |
          $log = Join-Path $env:TEMP "clipsearch-smoke.txt"
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath (Join-Path $PWD "app/ClipSearch.exe") -ArgumentList "--smoke" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill() }
          $text = if (Test-Path $log) { (Get-Content $log) -join " / " } else { "no smoke log" }
          $wl = Join-Path $env:LOCALAPPDATA "ClipSearch\window-log.txt"
          if (Test-Path $wl) { Get-Content $wl -Tail 15 }
          if ($text -match "SMOKE OK") { Write-Output "::notice::Window check: $text" } else { Write-Output "::warning::Window check: $text"; throw "window check failed" }

      - name: Pack the app into a zip (the installer downloads it)
        run: |
          7z a -tzip -mx=9 ClipSearch-win32-x64.zip ./app/*
          if ($LASTEXITCODE -ne 0) { throw "zip failed" }
          $mb = "{0:N1}" -f ((Get-Item ClipSearch-win32-x64.zip).Length / 1MB)
          Write-Output "::notice::App zip: $mb MB"

      - name: Build the installer (ClipSearchSetup.exe)
        run: |
          $log = dotnet build installer/ClipSearchSetup.csproj -c Release -o installer/out --nologo "-p:Version=$env:APP_VERSION" 2>&1
          $code = $LASTEXITCODE
          $log | Select-String -Pattern "error CS|error MSB|error NU|: error " | Select-Object -First 20 | ForEach-Object { Write-Output ("::error::" + $_.Line.Trim()) }
          $log | Select-Object -Last 12
          if ($code -ne 0) { throw "installer build failed" }
          New-Item -ItemType Directory -Force setup | Out-Null
          Copy-Item installer/out/ClipSearchSetup.exe setup/ClipSearchSetup.exe
          $kb = "{0:N0}" -f ((Get-Item setup/ClipSearchSetup.exe).Length / 1KB)
          Write-Output "::notice::Installer: $kb KB"
          $global:LASTEXITCODE = 0

      - name: Check the installer installs the app
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "cs-install-test\ClipSearch"
          $zip = Join-Path $PWD "ClipSearch-win32-x64.zip"
          $p = Start-Process -FilePath setup/ClipSearchSetup.exe -ArgumentList @("--silent", "--dir", "`"$dir`"", "--zip", "`"$zip`"", "--no-shortcuts", "--no-register") -PassThru -Wait
          $logf = Join-Path $env:TEMP "ClipSearchSetup.log"
          if (Test-Path $logf) { Get-Content $logf -Tail 20 }
          if ($p.ExitCode -ne 0) { Write-Output "::error::installer exit code $($p.ExitCode)"; throw "installer exit code $($p.ExitCode)" }
          foreach ($f in @("ClipSearch.exe", "Uninstall.exe", "resources\clip_backend.exe", "resources\ffmpeg.exe")) {
            if (-not (Test-Path (Join-Path $dir $f))) { Write-Output "::error::$f was not installed"; throw "$f was not installed" }
          }
          Write-Output "::notice::Installer works"

      - name: Check the installer window opens
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath setup/ClipSearchSetup.exe -ArgumentList "--selftest-ui" -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); Write-Output "::warning::installer window check timed out"; throw "timeout" }
          if ($p.ExitCode -ne 0) { Write-Output "::warning::installer window exit code $($p.ExitCode)"; throw "exit $($p.ExitCode)" }
          Write-Output "::notice::Installer window opens"

      - uses: actions/upload-artifact@v4
        with:
          name: win-release
          path: |
            ClipSearch-win32-x64.zip
            setup/ClipSearchSetup.exe
            notes.md
          retention-days: 30

  mac:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Rehearsal version
        if: ${{ inputs.version != '' }}
        env:
          V: ${{ inputs.version }}
        run: |
          echo "$V" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$' || { echo "bad version"; exit 1; }
          sed -i '' -E "s/^VERSION = \"[^\"]*\"/VERSION = \"$V\"/" clip_search.py
          grep -m1 '^VERSION' clip_search.py

      - name: Python (universal2) and PyInstaller
        run: |
          curl -sSfLo py.pkg https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg py.pkg -target / > /dev/null
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --quiet pyinstaller
          $PY -c "import platform, sys; print(platform.machine(), sys.version)"
          $PY clip_search.py --selftest
          echo "APP_VERSION=$($PY clip_search.py --version)" >> "$GITHUB_ENV"

      - name: Refuse to rebuild a released version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$APP_VERSION" --json tagName > /dev/null 2>&1; then
            echo "::error::Version $APP_VERSION is already released. Raise VERSION in clip_search.py for a new test build."
            exit 1
          fi

      - name: Write the Mac sources
        run: $PY clip_search.py --write-mac mac && ls mac

      - name: Build the engine (universal)
        run: |
          $PY -m PyInstaller --noconfirm --clean --onedir --target-arch universal2 --name clip_backend clip_search.py
          lipo -archs dist/clip_backend/clip_backend

      - name: Get ffmpeg (universal)
        run: |
          for a in arm64 x64; do curl -sSfL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-darwin-$a.gz" | gunzip > "ffmpeg-$a"; done
          lipo -create -output dist/clip_backend/ffmpeg ffmpeg-arm64 ffmpeg-x64
          chmod +x dist/clip_backend/ffmpeg
          codesign --force --sign - dist/clip_backend/ffmpeg
          lipo -archs dist/clip_backend/ffmpeg
          dist/clip_backend/ffmpeg -hide_banner -version | head -1

      - name: Build the window (Swift, universal) and the icon
        run: |
          cd mac
          swiftc -O -target arm64-apple-macos11 main.swift -o host-arm64
          swiftc -O -target x86_64-apple-macos11 main.swift -o host-x64
          lipo -create -output ClipSearch host-arm64 host-x64
          lipo -archs ClipSearch
          swiftc mkicon.swift -o mkicon && ./mkicon icon_1024.png
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon_1024.png --out "AppIcon.iconset/icon_${s}x${s}.png" > /dev/null
            d=$((s * 2)); sips -z $d $d icon_1024.png --out "AppIcon.iconset/icon_${s}x${s}@2x.png" > /dev/null
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Assemble ClipSearch.app
        run: |
          A=out/ClipSearch.app
          mkdir -p "$A/Contents/MacOS" "$A/Contents/Resources"
          cp mac/ClipSearch "$A/Contents/MacOS/ClipSearch"
          cp mac/Info.plist "$A/Contents/Info.plist"
          cp mac/AppIcon.icns "$A/Contents/Resources/AppIcon.icns"
          ditto dist/clip_backend "$A/Contents/Resources/backend"
          plutil -lint "$A/Contents/Info.plist"
          find "$A/Contents/Resources/backend" -type f | while read -r f; do
            if file "$f" | grep -q "Mach-O"; then codesign --force --sign - "$f"; fi
          done
          codesign --force --sign - "$A"
          codesign --verify --deep --strict --verbose=2 "$A"
          du -sh "$A"

      - name: Check the engine
        run: |
          B=out/ClipSearch.app/Contents/Resources/backend/clip_backend
          $B --selftest
          arch -x86_64 $B --version && echo "::notice::Intel engine runs (Rosetta)" || echo "::warning::Intel engine not checked"

      - name: Check the window opens
        run: |
          rm -f "$TMPDIR/clipsearch-smoke.txt"
          out/ClipSearch.app/Contents/MacOS/ClipSearch --smoke &
          p=$!
          for i in $(seq 1 90); do kill -0 $p 2>/dev/null || break; sleep 1; done
          kill $p 2>/dev/null || true
          tail -n 15 "$HOME/Library/Application Support/ClipSearch/window-log.txt" || true
          tail -n 15 "$HOME/Library/Application Support/ClipSearch/log.txt" || true
          r=$(cat "$TMPDIR/clipsearch-smoke.txt" 2>/dev/null || echo "no smoke log")
          echo "$r"
          case "$r" in *"SMOKE OK"*) echo "::notice::Mac window check: $r" ;; *) echo "::error::Mac window check: $r"; exit 1 ;; esac

      - name: Pack the dmg (download) and the zip (updates)
        run: |
          ditto -c -k --keepParent out/ClipSearch.app ClipSearch-mac.zip
          mkdir dmg
          ditto out/ClipSearch.app dmg/ClipSearch.app
          ln -s /Applications dmg/Applications
          cp mac/howto.txt "dmg/Если не открывается - How to open.txt"
          for i in 1 2 3; do hdiutil create -volname ClipSearch -srcfolder dmg -ov -format UDZO ClipSearch-mac.dmg && break; sleep 5; done
          test -f ClipSearch-mac.dmg
          echo "::notice::Mac dmg: $(du -h ClipSearch-mac.dmg | cut -f1), zip: $(du -h ClipSearch-mac.zip | cut -f1)"

      - name: Check the update zip unpacks into a working app
        run: |
          d=$(mktemp -d)
          ditto -x -k ClipSearch-mac.zip "$d"
          codesign --verify --deep --strict "$d/ClipSearch.app"
          "$d/ClipSearch.app/Contents/Resources/backend/clip_backend" --version

      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: |
            ClipSearch-mac.dmg
            ClipSearch-mac.zip
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: mac-icon
          path: mac/icon_1024.png
          retention-days: 7

  release:
    needs: [build, mac]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VER: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-release
          path: rel
      - uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: rel
      - name: Publish the test build (pre-release, not offered to users)
        run: |
          set -e
          ls -la rel rel/setup
          tag="v$VER-test"
          if gh release view "$tag" --json tagName > /dev/null 2>&1; then gh release delete "$tag" --cleanup-tag --yes; fi
          { echo "Тестовая сборка. Не для общего доступа."; echo; cat rel/notes.md; } > test-notes.md
          gh release create "$tag" rel/ClipSearch-win32-x64.zip rel/setup/ClipSearchSetup.exe rel/ClipSearch-mac.dmg rel/ClipSearch-mac.zip \
            --title "ClipSearch $VER (test)" --notes-file test-notes.md --prerelease --latest=false --target "$GITHUB_SHA"
          echo "::notice::Test build: https://github.com/$GH_REPO/releases/tag/$tag"

  win-net-check:
    needs: [build, release]
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-release
          path: rel
      - name: Move the installer
        run: Copy-Item rel/setup/ClipSearchSetup.exe rel/ClipSearchSetup.exe
      - name: Check the test installer downloads this build
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "cs-net-test\ClipSearch"
          $p = Start-Process -FilePath rel/ClipSearchSetup.exe -ArgumentList @("--silent", "--dir", "`"$dir`"", "--no-shortcuts", "--no-register") -PassThru -Wait
          $logf = Join-Path $env:TEMP "ClipSearchSetup.log"
          if (Test-Path $logf) { Get-Content $logf -Tail 12 }
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $pv = (Get-Item (Join-Path $dir "ClipSearch.exe")).VersionInfo.ProductVersion
          Write-Output "Installed: $pv"
          if (-not $pv.StartsWith($env:APP_VERSION)) { Write-Output "::error::installed $pv, expected $env:APP_VERSION"; throw "wrong version installed" }
          Write-Output "::notice::Test installer installs $pv"
